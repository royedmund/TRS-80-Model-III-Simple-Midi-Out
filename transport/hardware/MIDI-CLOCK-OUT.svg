<text x="48" y="315" font-size="14" class="" text-anchor="start" font-weight="normal">9600 baud 8N1  →  MIDI 31250 baud. DB25 pin 3, Nano D0/D11, DIN pins 1/3: unconnected.</text>
<rect x="25" y="352" width="1230" height="164" rx="9" class="panel"/>
<text x="43" y="383" font-size="19" class="" text-anchor="start" font-weight="bold">02   Power, clock and test notes</text>
<text x="48" y="409" font-size="14" class="" text-anchor="start" font-weight="normal">Regulated 5 V; shared logic ground. No power from DB25. Verify MAX3232 module direction and DIN pin numbering.</text>
<text x="48" y="436" font-size="14" class="" text-anchor="start" font-weight="normal">Nano decodes F6/F1/F2/F3 records and emits MIDI F8 clock, FA start, FC stop and note data on D1.</text>
<text x="48" y="463" font-size="14" class="" text-anchor="start" font-weight="normal">Disconnect MIDI OUT during firmware upload/reset. Use a powered MIDI THRU box for multiple destinations.</text>
<text x="48" y="490" font-size="14" class="" text-anchor="start" font-weight="normal">Direct Nano TX driver is a prototype; verify loop current and receiver compatibility. Do not connect RS-232 levels to logic pins.</text>
</svg>