<text x="815" y="672" font-size="12" class="" text-anchor="start" font-weight="normal">Closed at reset = MIDI IN; open = legacy output only.</text>
<text x="815" y="694" font-size="12" class="" text-anchor="start" font-weight="normal">Regulated 5 V; logic GND shared with RS-232 only.</text>
<rect x="25" y="734" width="1230" height="92" rx="7" class="panel"/>
<text x="45" y="759" font-size="15" class="" text-anchor="start" font-weight="bold">IMPORTANT  •  USB / UART isolation</text>
<text x="45" y="781" font-size="13" class="" text-anchor="start" font-weight="normal">Fit a removable link (JP1) between MIDI_RX and Nano D0. Open during upload; disconnect MIDI OUT during upload/reset.</text>
<text x="45" y="803" font-size="13" class="" text-anchor="start" font-weight="normal">Isolate the onboard USB-UART TX path to D0 for reliable MIDI reception (verify board-specific series resistor/link). No RS-232 voltage on Nano pins.</text>
