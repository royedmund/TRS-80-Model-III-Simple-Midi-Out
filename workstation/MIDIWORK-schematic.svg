<text x="48" y="615" font-size="13" class="" text-anchor="start" font-weight="normal">Isolation boundary: no connection from DIN IN pin 2 or shell to logic GND.</text>
<text x="48" y="639" font-size="13" class="" text-anchor="start" font-weight="normal">R1 limits loop current; D1 reverse-protects the LED (cathode to pin 2).</text>
<text x="48" y="663" font-size="13" class="" text-anchor="start" font-weight="normal">C1 adjacent to U3 pins 8/5; pin 7 high. JP1 at D0: see power/programming note.</text>
<text x="48" y="687" font-size="13" class="" text-anchor="start" font-weight="normal">Verify the optocoupler threshold and waveform with your actual MIDI source.</text>
